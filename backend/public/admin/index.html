<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>misello.gt — Panel de Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800" x-data="adminApp()" x-init="init()" x-cloak>

  <!-- ==================== LOGIN ==================== -->
  <template x-if="!token">
    <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
          <div class="text-4xl font-bold text-indigo-600 mb-2">misello.gt</div>
          <div class="text-gray-500">Panel de Administración</div>
        </div>
        <form @submit.prevent="login()">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" x-model="loginForm.email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" x-model="loginForm.password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
          </div>
          <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition font-medium" :disabled="loading">
            <span x-show="!loading">Iniciar sesión</span>
            <span x-show="loading"><i class="fas fa-spinner fa-spin"></i> Cargando...</span>
          </button>
        </form>
        <div x-show="error" class="mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm" x-text="error"></div>
      </div>
    </div>
  </template>

  <!-- ==================== APP ==================== -->
  <template x-if="token">
    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="p-6 border-b border-gray-800">
          <div class="text-2xl font-bold">misello.gt</div>
          <div class="text-xs text-gray-400 mt-1" x-text="user?.email"></div>
        </div>
        <nav class="flex-1 p-4 space-y-1">
          <a @click="section='dashboard'; loadDashboard()" :class="section=='dashboard' ? 'bg-indigo-600' : 'hover:bg-gray-800'" class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition">
            <i class="fas fa-chart-line w-6"></i> Dashboard
          </a>
          <a @click="section='products'; loadProducts()" :class="section=='products' ? 'bg-indigo-600' : 'hover:bg-gray-800'" class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition">
            <i class="fas fa-box w-6"></i> Productos
          </a>
          <a @click="section='inks'; loadInks()" :class="section=='inks' ? 'bg-indigo-600' : 'hover:bg-gray-800'" class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition">
            <i class="fas fa-tint w-6"></i> Tintas
          </a>
          <a @click="section='fonts'; loadFonts()" :class="section=='fonts' ? 'bg-indigo-600' : 'hover:bg-gray-800'" class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition">
            <i class="fas fa-font w-6"></i> Tipografías
          </a>
          <a @click="section='orders'; loadOrders()" :class="section=='orders' ? 'bg-indigo-600' : 'hover:bg-gray-800'" class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition">
            <i class="fas fa-shopping-bag w-6"></i> Pedidos
          </a>
          <a @click="section='payments'; loadPayments()" :class="section=='payments' ? 'bg-indigo-600' : 'hover:bg-gray-800'" class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition">
            <i class="fas fa-credit-card w-6"></i> Pagos
          </a>
          <a @click="section='inventory'; loadInventory()" :class="section=='inventory' ? 'bg-indigo-600' : 'hover:bg-gray-800'" class="flex items-center px-4 py-3 rounded-lg cursor-pointer transition">
            <i class="fas fa-warehouse w-6"></i> Inventario
          </a>
        </nav>
        <div class="p-4 border-t border-gray-800">
          <button @click="logout()" class="w-full flex items-center px-4 py-2 rounded-lg hover:bg-gray-800 transition text-left">
            <i class="fas fa-sign-out-alt w-6"></i> Cerrar sesión
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-auto">
        <div class="p-8 fade-in">

          <!-- ==================== DASHBOARD ==================== -->
          <div x-show="section === 'dashboard'">
            <h1 class="text-3xl font-bold mb-6">Dashboard</h1>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="text-sm text-gray-500 mb-1">Productos</div>
                <div class="text-3xl font-bold text-indigo-600" x-text="dashboard.products"></div>
              </div>
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="text-sm text-gray-500 mb-1">Tintas</div>
                <div class="text-3xl font-bold text-blue-600" x-text="dashboard.inks"></div>
              </div>
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="text-sm text-gray-500 mb-1">Pedidos hoy</div>
                <div class="text-3xl font-bold text-green-600" x-text="dashboard.ordersToday"></div>
              </div>
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="text-sm text-gray-500 mb-1">Stock bajo</div>
                <div class="text-3xl font-bold text-red-600" x-text="dashboard.lowStock"></div>
              </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h2 class="text-lg font-semibold mb-4">Pedidos recientes</h2>
                <table class="w-full text-sm">
                  <thead class="text-gray-500 border-b">
                    <tr><th class="text-left pb-2">#</th><th class="text-left pb-2">Cliente</th><th class="text-left pb-2">Estado</th><th class="text-right pb-2">Total</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="o in dashboard.recentOrders" :key="o.id">
                      <tr class="border-b hover:bg-gray-50">
                        <td class="py-2" x-text="o.orderNumber"></td>
                        <td class="py-2" x-text="o.user?.email || '—'"></td>
                        <td class="py-2"><span class="px-2 py-1 rounded text-xs font-medium" :class="statusColor(o.status)" x-text="o.status"></span></td>
                        <td class="py-2 text-right" x-text="'Q'+o.totalAmount"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <h2 class="text-lg font-semibold mb-4">Alertas de stock</h2>
                <table class="w-full text-sm">
                  <thead class="text-gray-500 border-b">
                    <tr><th class="text-left pb-2">Producto</th><th class="text-right pb-2">Stock</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="p in dashboard.lowStockItems" :key="p.id">
                      <tr class="border-b hover:bg-gray-50">
                        <td class="py-2" x-text="p.name"></td>
                        <td class="py-2 text-right font-bold text-red-600" x-text="p.stock"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ==================== PRODUCTOS ==================== -->
          <div x-show="section === 'products'">
            <div class="flex justify-between items-center mb-6">
              <h1 class="text-3xl font-bold">Productos</h1>
              <button @click="openProductModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                <i class="fas fa-plus mr-2"></i>Nuevo producto
              </button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                  <tr>
                    <th class="px-4 py-3 text-left">SKU</th>
                    <th class="px-4 py-3 text-left">Nombre</th>
                    <th class="px-4 py-3 text-left">Categoría</th>
                    <th class="px-4 py-3 text-right">Precio</th>
                    <th class="px-4 py-3 text-right">Stock</th>
                    <th class="px-4 py-3 text-center">Estado</th>
                    <th class="px-4 py-3 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="p in products" :key="p.id">
                    <tr class="border-b hover:bg-gray-50">
                      <td class="px-4 py-3 font-mono" x-text="p.sku"></td>
                      <td class="px-4 py-3" x-text="p.name"></td>
                      <td class="px-4 py-3" x-text="p.category"></td>
                      <td class="px-4 py-3 text-right" x-text="'Q'+p.basePrice"></td>
                      <td class="px-4 py-3 text-right" x-text="p.stock"></td>
                      <td class="px-4 py-3 text-center">
                        <span class="px-2 py-1 rounded text-xs font-medium" :class="p.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'" x-text="p.isActive ? 'Activo' : 'Inactivo'"></span>
                      </td>
                      <td class="px-4 py-3 text-center space-x-2">
                        <button @click="openProductModal(p)" class="text-indigo-600 hover:text-indigo-800"><i class="fas fa-edit"></i></button>
                        <button @click="deleteProduct(p.id)" class="text-red-600 hover:text-red-800"><i class="fas fa-trash"></i></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- ==================== TINTAS ==================== -->
          <div x-show="section === 'inks'">
            <div class="flex justify-between items-center mb-6">
              <h1 class="text-3xl font-bold">Tintas</h1>
              <button @click="openInkModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                <i class="fas fa-plus mr-2"></i>Nueva tinta
              </button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                  <tr>
                    <th class="px-4 py-3 text-left">Código</th>
                    <th class="px-4 py-3 text-left">Color</th>
                    <th class="px-4 py-3 text-left">Muestra</th>
                    <th class="px-4 py-3 text-right">Precio</th>
                    <th class="px-4 py-3 text-right">Stock</th>
                    <th class="px-4 py-3 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="i in inks" :key="i.id">
                    <tr class="border-b hover:bg-gray-50">
                      <td class="px-4 py-3 font-mono" x-text="i.code"></td>
                      <td class="px-4 py-3" x-text="i.color"></td>
                      <td class="px-4 py-3"><div class="w-6 h-6 rounded border" :style="'background-color:'+i.hexCode"></div></td>
                      <td class="px-4 py-3 text-right" x-text="'Q'+i.price"></td>
                      <td class="px-4 py-3 text-right" x-text="i.stock"></td>
                      <td class="px-4 py-3 text-center space-x-2">
                        <button @click="openInkModal(i)" class="text-indigo-600 hover:text-indigo-800"><i class="fas fa-edit"></i></button>
                        <button @click="deleteInk(i.id)" class="text-red-600 hover:text-red-800"><i class="fas fa-trash"></i></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- ==================== TIPOGRAFÍAS ==================== -->
          <div x-show="section === 'fonts'">
            <div class="flex justify-between items-center mb-6">
              <h1 class="text-3xl font-bold">Tipografías</h1>
              <button @click="openFontModal()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition">
                <i class="fas fa-plus mr-2"></i>Subir fuente
              </button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                  <tr>
                    <th class="px-4 py-3 text-left">Nombre</th>
                    <th class="px-4 py-3 text-left">Archivo</th>
                    <th class="px-4 py-3 text-center">Activo</th>
                    <th class="px-4 py-3 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="f in fonts" :key="f.id">
                    <tr class="border-b hover:bg-gray-50">
                      <td class="px-4 py-3" x-text="f.name"></td>
                      <td class="px-4 py-3 font-mono text-xs" x-text="f.fileName"></td>
                      <td class="px-4 py-3 text-center">
                        <span class="px-2 py-1 rounded text-xs font-medium" :class="f.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'" x-text="f.isActive ? 'Sí' : 'No'"></span>
                      </td>
                      <td class="px-4 py-3 text-center space-x-2">
                        <button @click="toggleFont(f.id, !f.isActive)" class="text-indigo-600 hover:text-indigo-800"><i class="fas fa-toggle-on"></i></button>
                        <button @click="deleteFont(f.id)" class="text-red-600 hover:text-red-800"><i class="fas fa-trash"></i></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- ==================== PEDIDOS ==================== -->
          <div x-show="section === 'orders'">
            <div class="flex justify-between items-center mb-6">
              <h1 class="text-3xl font-bold">Pedidos</h1>
              <select x-model="orderFilter" @change="loadOrders()" class="border rounded-lg px-3 py-2">
                <option value="">Todos</option>
                <option value="DRAFT">Borrador</option>
                <option value="PENDING_PAYMENT">Pendiente de pago</option>
                <option value="CONFIRMED">Confirmado</option>
                <option value="IN_PRODUCTION">En producción</option>
                <option value="FINISHED">Terminado</option>
                <option value="SHIPPED">Enviado</option>
                <option value="CANCELLED">Cancelado</option>
              </select>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                  <tr>
                    <th class="px-4 py-3 text-left"># Orden</th>
                    <th class="px-4 py-3 text-left">Cliente</th>
                    <th class="px-4 py-3 text-left">Estado</th>
                    <th class="px-4 py-3 text-right">Total</th>
                    <th class="px-4 py-3 text-center">Fecha</th>
                    <th class="px-4 py-3 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="o in orders" :key="o.id">
                    <tr class="border-b hover:bg-gray-50">
                      <td class="px-4 py-3 font-mono font-medium" x-text="o.orderNumber"></td>
                      <td class="px-4 py-3" x-text="o.user?.email || '—'"></td>
                      <td class="px-4 py-3"><span class="px-2 py-1 rounded text-xs font-medium" :class="statusColor(o.status)" x-text="o.status"></span></td>
                      <td class="px-4 py-3 text-right font-medium" x-text="'Q'+o.totalAmount"></td>
                      <td class="px-4 py-3 text-center text-gray-500" x-text="formatDate(o.createdAt)"></td>
                      <td class="px-4 py-3 text-center space-x-2">
                        <button @click="viewOrder(o)" class="text-indigo-600 hover:text-indigo-800"><i class="fas fa-eye"></i></button>
                        <button @click="openStatusModal(o)" class="text-green-600 hover:text-green-800"><i class="fas fa-exchange-alt"></i></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- ==================== PAGOS ==================== -->
          <div x-show="section === 'payments'">
            <h1 class="text-3xl font-bold mb-6">Pagos</h1>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                  <tr>
                    <th class="px-4 py-3 text-left">Método</th>
                    <th class="px-4 py-3 text-right">Monto</th>
                    <th class="px-4 py-3 text-left">Estado</th>
                    <th class="px-4 py-3 text-left">Referencia</th>
                    <th class="px-4 py-3 text-center">Fecha</th>
                    <th class="px-4 py-3 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="p in payments" :key="p.id">
                    <tr class="border-b hover:bg-gray-50">
                      <td class="px-4 py-3" x-text="p.method"></td>
                      <td class="px-4 py-3 text-right font-medium" x-text="'Q'+p.amount"></td>
                      <td class="px-4 py-3"><span class="px-2 py-1 rounded text-xs font-medium" :class="paymentStatusColor(p.status)" x-text="p.status"></span></td>
                      <td class="px-4 py-3 font-mono text-xs" x-text="p.referenceCode || '—'"></td>
                      <td class="px-4 py-3 text-center text-gray-500" x-text="formatDate(p.createdAt)"></td>
                      <td class="px-4 py-3 text-center space-x-2">
                        <template x-if="p.status === 'PENDING'">
                          <div class="inline space-x-2">
                            <button @click="confirmPayment(p.id)" class="text-green-600 hover:text-green-800" title="Confirmar"><i class="fas fa-check"></i></button>
                            <button @click="rejectPayment(p.id)" class="text-red-600 hover:text-red-800" title="Rechazar"><i class="fas fa-times"></i></button>
                          </div>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- ==================== INVENTARIO ==================== -->
          <div x-show="section === 'inventory'">
            <div class="flex justify-between items-center mb-6">
              <h1 class="text-3xl font-bold">Inventario</h1>
              <button @click="openAdjustModal()" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 transition">
                <i class="fas fa-sliders-h mr-2"></i>Ajustar stock
              </button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="text-sm text-gray-500">Productos agotados</div>
                <div class="text-2xl font-bold text-red-600" x-text="inventorySummary.outOfStockProducts"></div>
              </div>
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="text-sm text-gray-500">Tintas agotadas</div>
                <div class="text-2xl font-bold text-red-600" x-text="inventorySummary.outOfStockInks"></div>
              </div>
              <div class="bg-white p-6 rounded-xl shadow-sm border">
                <div class="text-sm text-gray-500">Total SKU activos</div>
                <div class="text-2xl font-bold text-indigo-600" x-text="inventorySummary.totalProducts + inventorySummary.totalInks"></div>
              </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
              <h2 class="text-lg font-semibold px-4 pt-4">Movimientos recientes</h2>
              <table class="w-full text-sm mt-2">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                  <tr>
                    <th class="px-4 py-3 text-left">Producto</th>
                    <th class="px-4 py-3 text-right">Cambio</th>
                    <th class="px-4 py-3 text-left">Razón</th>
                    <th class="px-4 py-3 text-center">Fecha</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="log in inventoryLogs" :key="log.id">
                    <tr class="border-b hover:bg-gray-50">
                      <td class="px-4 py-3" x-text="log.product?.name || log.productId"></td>
                      <td class="px-4 py-3 text-right font-medium" :class="log.delta >= 0 ? 'text-green-600' : 'text-red-600'" x-text="(log.delta > 0 ? '+' : '') + log.delta"></td>
                      <td class="px-4 py-3 text-gray-600" x-text="log.reason"></td>
                      <td class="px-4 py-3 text-center text-gray-500 text-xs" x-text="formatDate(log.createdAt)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <!-- ==================== MODALES ==================== -->

          <!-- Modal Producto -->
          <div x-show="modal === 'product'" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="modal = null">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 max-h-screen overflow-auto">
              <h2 class="text-xl font-bold mb-4" x-text="productForm.id ? 'Editar Producto' : 'Nuevo Producto'"></h2>
              <div class="space-y-3">
                <input x-model="productForm.sku" placeholder="SKU" class="w-full border rounded-lg px-3 py-2">
                <input x-model="productForm.name" placeholder="Nombre" class="w-full border rounded-lg px-3 py-2">
                <textarea x-model="productForm.description" placeholder="Descripción" class="w-full border rounded-lg px-3 py-2"></textarea>
                <select x-model="productForm.category" class="w-full border rounded-lg px-3 py-2">
                  <option value="MONTURA_AUTOMATICA">Montura Automática</option>
                  <option value="FECHADOR">Fechador</option>
                  <option value="PORTATIL">Portátil</option>
                  <option value="MADERA">Madera</option>
                  <option value="EMBOSADORA">Embosadora</option>
                  <option value="ALMOHADILLA_AUTOMATICA">Almohadilla Automática</option>
                  <option value="ALMOHADILLA_MADERA">Almohadilla Madera</option>
                  <option value="TINTA">Tinta</option>
                </select>
                <select x-model="productForm.shape" class="w-full border rounded-lg px-3 py-2">
                  <option value="">— Sin forma —</option>
                  <option value="RECTANGULAR">Rectangular</option>
                  <option value="CIRCULAR">Circular</option>
                  <option value="OVAL">Oval</option>
                </select>
                <div class="grid grid-cols-2 gap-3">
                  <input x-model.number="productForm.widthMm" type="number" placeholder="Ancho mm" class="w-full border rounded-lg px-3 py-2">
                  <input x-model.number="productForm.heightMm" type="number" placeholder="Alto mm" class="w-full border rounded-lg px-3 py-2">
                </div>
                <input x-model="productForm.imageUrl" placeholder="URL de imagen" class="w-full border rounded-lg px-3 py-2">
                <input x-model.number="productForm.basePrice" type="number" step="0.01" placeholder="Precio base" class="w-full border rounded-lg px-3 py-2">
                <input x-model.number="productForm.stock" type="number" placeholder="Stock inicial" class="w-full border rounded-lg px-3 py-2">
              </div>
              <div class="flex justify-end space-x-3 mt-6">
                <button @click="modal = null" class="px-4 py-2 rounded-lg border hover:bg-gray-50">Cancelar</button>
                <button @click="saveProduct()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700" :disabled="loading">
                  <span x-show="!loading">Guardar</span><span x-show="loading">Guardando...</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Modal Tinta -->
          <div x-show="modal === 'ink'" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="modal = null">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
              <h2 class="text-xl font-bold mb-4" x-text="inkForm.id ? 'Editar Tinta' : 'Nueva Tinta'"></h2>
              <div class="space-y-3">
                <input x-model="inkForm.code" placeholder="Código" class="w-full border rounded-lg px-3 py-2">
                <input x-model="inkForm.color" placeholder="Nombre del color" class="w-full border rounded-lg px-3 py-2">
                <input x-model="inkForm.hexCode" placeholder="Hex (ej: #000000)" class="w-full border rounded-lg px-3 py-2">
                <input x-model.number="inkForm.price" type="number" step="0.01" placeholder="Precio" class="w-full border rounded-lg px-3 py-2">
                <input x-model.number="inkForm.stock" type="number" placeholder="Stock" class="w-full border rounded-lg px-3 py-2">
              </div>
              <div class="flex justify-end space-x-3 mt-6">
                <button @click="modal = null" class="px-4 py-2 rounded-lg border hover:bg-gray-50">Cancelar</button>
                <button @click="saveInk()" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700" :disabled="loading">Guardar</button>
              </div>
            </div>
          </div>

          <!-- Modal Fuente -->
          <div x-show="modal === 'font'" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="modal = null">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
              <h2 class="text-xl font-bold mb-4">Subir Tipografía</h2>
              <div class="space-y-3">
                <input x-model="fontForm.name" placeholder="Nombre de la fuente" class="w-full border rounded-lg px-3 py-2">
                <input type="file" @change="fontForm.file = $event.target.files[0]" accept=".ttf,.otf" class="w-full border rounded-lg px-3 py-2">
                <p class="text-xs text-gray-500">Archivos .ttf o .otf, máximo 5MB</p>
              </div>
              <div class="flex justify-end space-x-3 mt-6">
                <button @click="modal = null" class="px-4 py-2 rounded-lg border hover:bg-gray-50">Cancelar</button>
                <button @click="saveFont()" class="px-4 py-2 rounded-lg bg-purple-600 text-white hover:bg-purple-700" :disabled="loading">Subir</button>
              </div>
            </div>
          </div>

          <!-- Modal Ver Pedido -->
          <div x-show="modal === 'order'" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="modal = null">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl p-6 max-h-screen overflow-auto">
              <h2 class="text-xl font-bold mb-4" x-text="'Pedido ' + (selectedOrder?.orderNumber || '')"></h2>
              <template x-if="selectedOrder">
                <div class="space-y-4">
                  <div class="grid grid-cols-2 gap-4 text-sm">
                    <div><span class="text-gray-500">Cliente:</span> <span x-text="selectedOrder.user?.email"></span></div>
                    <div><span class="text-gray-500">Estado:</span> <span class="px-2 py-1 rounded text-xs font-medium" :class="statusColor(selectedOrder.status)" x-text="selectedOrder.status"></span></div>
                    <div><span class="text-gray-500">Total:</span> <span class="font-bold" x-text="'Q'+selectedOrder.totalAmount"></span></div>
                    <div><span class="text-gray-500">Fecha:</span> <span x-text="formatDate(selectedOrder.createdAt)"></span></div>
                    <div x-show="selectedOrder.courierTracking"><span class="text-gray-500">Tracking:</span> <span x-text="selectedOrder.courierTracking"></span></div>
                    <div x-show="selectedOrder.nitOrCui"><span class="text-gray-500">NIT/CUI:</span> <span x-text="selectedOrder.nitOrCui"></span></div>
                  </div>
                  <h3 class="font-semibold mt-4">Items</h3>
                  <table class="w-full text-sm border rounded-lg overflow-hidden">
                    <thead class="bg-gray-50"><tr><th class="px-3 py-2 text-left">Producto</th><th class="px-3 py-2 text-right">Cant.</th><th class="px-3 py-2 text-right">Precio</th></tr></thead>
                    <tbody>
                      <template x-for="item in selectedOrder.items" :key="item.id">
                        <tr class="border-b"><td class="px-3 py-2" x-text="item.product?.name"></td><td class="px-3 py-2 text-right" x-text="item.quantity"></td><td class="px-3 py-2 text-right" x-text="'Q'+item.unitPrice"></td></tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
              <div class="flex justify-end mt-6">
                <button @click="modal = null" class="px-4 py-2 rounded-lg border hover:bg-gray-50">Cerrar</button>
              </div>
            </div>
          </div>

          <!-- Modal Cambiar Estado -->
          <div x-show="modal === 'status'" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="modal = null">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
              <h2 class="text-xl font-bold mb-4">Cambiar Estado</h2>
              <p class="text-sm text-gray-600 mb-4">Pedido: <span x-text="selectedOrder?.orderNumber"></span></p>
              <select x-model="statusForm.status" class="w-full border rounded-lg px-3 py-2 mb-4">
                <option value="DRAFT">Borrador</option>
                <option value="PENDING_PAYMENT">Pendiente de pago</option>
                <option value="CONFIRMED">Confirmado</option>
                <option value="IN_PRODUCTION">En producción</option>
                <option value="FINISHED">Terminado</option>
                <option value="SHIPPED">Enviado</option>
                <option value="CANCELLED">Cancelado</option>
              </select>
              <input x-model="statusForm.tracking" placeholder="Número de tracking (opcional)" class="w-full border rounded-lg px-3 py-2 mb-4">
              <div class="flex justify-end space-x-3">
                <button @click="modal = null" class="px-4 py-2 rounded-lg border hover:bg-gray-50">Cancelar</button>
                <button @click="updateOrderStatus()" class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700" :disabled="loading">Guardar</button>
              </div>
            </div>
          </div>

          <!-- Modal Ajustar Stock -->
          <div x-show="modal === 'adjust'" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="modal = null">
            <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
              <h2 class="text-xl font-bold mb-4">Ajustar Stock</h2>
              <select x-model="adjustForm.productId" class="w-full border rounded-lg px-3 py-2 mb-3">
                <option value="">Seleccionar producto...</option>
                <template x-for="p in products" :key="p.id">
                  <option :value="p.id" x-text="p.sku + ' — ' + p.name + ' (stock: ' + p.stock + ')'"></option>
                </template>
              </select>
              <input x-model.number="adjustForm.delta" type="number" placeholder="Cantidad (+ entrada, - salida)" class="w-full border rounded-lg px-3 py-2 mb-3">
              <input x-model="adjustForm.reason" placeholder="Razón del ajuste" class="w-full border rounded-lg px-3 py-2 mb-3">
              <div class="flex justify-end space-x-3">
                <button @click="modal = null" class="px-4 py-2 rounded-lg border hover:bg-gray-50">Cancelar</button>
                <button @click="saveAdjust()" class="px-4 py-2 rounded-lg bg-orange-600 text-white hover:bg-orange-700" :disabled="loading">Ajustar</button>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </template>

  <!-- ==================== SCRIPTS ==================== -->
  <script>
    function adminApp() {
      return {
        API: '/api/v1',
        token: localStorage.getItem('admin_token') || '',
        user: JSON.parse(localStorage.getItem('admin_user') || 'null'),
        section: 'dashboard',
        loading: false,
        error: '',
        modal: null,
        loginForm: { email: '', password: '' },

        // Data
        products: [], inks: [], fonts: [], orders: [], payments: [], inventoryLogs: [],
        dashboard: { products: 0, inks: 0, ordersToday: 0, lowStock: 0, recentOrders: [], lowStockItems: [] },
        inventorySummary: { totalProducts: 0, totalInks: 0, outOfStockProducts: 0, outOfStockInks: 0 },
        orderFilter: '',
        selectedOrder: null,

        // Forms
        productForm: {}, inkForm: {}, fontForm: {}, statusForm: {}, adjustForm: {},

        init() {
          if (this.token) {
            this.loadDashboard();
          }
        },

        async api(method, path, body) {
          const opts = {
            method,
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + this.token,
            },
          };
          if (body) opts.body = JSON.stringify(body);
          const res = await fetch(this.API + path, opts);
          if (res.status === 401) { this.logout(); return; }
          return res.json();
        },

        async login() {
          this.loading = true; this.error = '';
          try {
            const res = await fetch(this.API + '/auth/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.loginForm),
            });
            const data = await res.json();
            if (!res.ok) { this.error = data.message || 'Error de login'; return; }
            this.token = data.accessToken;
            this.user = data.user;
            localStorage.setItem('admin_token', this.token);
            localStorage.setItem('admin_user', JSON.stringify(this.user));
            this.loadDashboard();
          } catch (e) {
            this.error = 'Error de conexión';
          } finally {
            this.loading = false;
          }
        },

        logout() {
          this.token = ''; this.user = null;
          localStorage.removeItem('admin_token');
          localStorage.removeItem('admin_user');
        },

        // Dashboard
        async loadDashboard() {
          this.loading = true;
          const [prod, ink, orders, low] = await Promise.all([
            this.api('GET', '/products/admin/all?take=1'),
            this.api('GET', '/inks/admin/all'),
            this.api('GET', '/orders/admin/all?take=5'),
            this.api('GET', '/inventory/low-stock'),
          ]);
          this.dashboard.products = prod?.total || 0;
          this.dashboard.inks = ink?.length || 0;
          this.dashboard.ordersToday = orders?.total || 0;
          this.dashboard.recentOrders = orders?.items || [];
          this.dashboard.lowStock = (low?.products?.length || 0) + (low?.inks?.length || 0);
          this.dashboard.lowStockItems = [...(low?.products || []), ...(low?.inks || [])].sort((a,b) => a.stock - b.stock).slice(0, 5);
          this.inventorySummary = await this.api('GET', '/inventory/summary');
          this.loading = false;
        },

        // Productos
        async loadProducts() {
          const data = await this.api('GET', '/products/admin/all?take=100');
          this.products = data?.items || [];
        },
        openProductModal(p = null) {
          this.productForm = p ? { ...p } : { category: 'MONTURA_AUTOMATICA', shape: '', isActive: true, stock: 0, basePrice: 0 };
          this.modal = 'product';
        },
        async saveProduct() {
          this.loading = true;
          const path = this.productForm.id ? '/products/admin/' + this.productForm.id : '/products/admin';
          const method = this.productForm.id ? 'PATCH' : 'POST';
          await this.api(method, path, this.productForm);
          this.modal = null; this.loadProducts();
          this.loading = false;
        },
        async deleteProduct(id) {
          if (!confirm('¿Eliminar este producto?')) return;
          await this.api('DELETE', '/products/admin/' + id);
          this.loadProducts();
        },

        // Tintas
        async loadInks() {
          const data = await this.api('GET', '/inks/admin/all');
          this.inks = data || [];
        },
        openInkModal(i = null) {
          this.inkForm = i ? { ...i } : { stock: 0, price: 0 };
          this.modal = 'ink';
        },
        async saveInk() {
          this.loading = true;
          const path = this.inkForm.id ? '/inks/admin/' + this.inkForm.id : '/inks/admin';
          const method = this.inkForm.id ? 'PATCH' : 'POST';
          await this.api(method, path, this.inkForm);
          this.modal = null; this.loadInks();
          this.loading = false;
        },
        async deleteInk(id) {
          if (!confirm('¿Eliminar esta tinta?')) return;
          await this.api('DELETE', '/inks/admin/' + id);
          this.loadInks();
        },

        // Fuentes
        async loadFonts() {
          const data = await this.api('GET', '/fonts/admin/all');
          this.fonts = data || [];
        },
        openFontModal() {
          this.fontForm = { name: '', file: null };
          this.modal = 'font';
        },
        async saveFont() {
          this.loading = true;
          const formData = new FormData();
          formData.append('name', this.fontForm.name);
          formData.append('file', this.fontForm.file);
          await fetch(this.API + '/fonts/admin', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + this.token },
            body: formData,
          });
          this.modal = null; this.loadFonts();
          this.loading = false;
        },
        async toggleFont(id, active) {
          await this.api('PATCH', '/fonts/admin/' + id, { isActive: active });
          this.loadFonts();
        },
        async deleteFont(id) {
          if (!confirm('¿Eliminar esta fuente?')) return;
          await this.api('DELETE', '/fonts/admin/' + id);
          this.loadFonts();
        },

        // Pedidos
        async loadOrders() {
          const url = '/orders/admin/all?take=50' + (this.orderFilter ? '&status=' + this.orderFilter : '');
          const data = await this.api('GET', url);
          this.orders = data?.items || [];
        },
        viewOrder(o) {
          this.selectedOrder = o;
          this.modal = 'order';
        },
        openStatusModal(o) {
          this.selectedOrder = o;
          this.statusForm = { status: o.status, tracking: o.courierTracking || '' };
          this.modal = 'status';
        },
        async updateOrderStatus() {
          this.loading = true;
          await this.api('PATCH', '/orders/admin/' + this.selectedOrder.id + '/status', { status: this.statusForm.status });
          if (this.statusForm.tracking) {
            await this.api('PATCH', '/orders/admin/' + this.selectedOrder.id + '/tracking', { courierTracking: this.statusForm.tracking });
          }
          this.modal = null; this.loadOrders();
          this.loading = false;
        },

        // Pagos
        async loadPayments() {
          const data = await this.api('GET', '/payments/admin/all?take=50');
          this.payments = data?.items || [];
        },
        async confirmPayment(id) {
          if (!confirm('¿Confirmar este pago?')) return;
          await this.api('PATCH', '/payments/admin/' + id + '/confirm', {});
          this.loadPayments();
        },
        async rejectPayment(id) {
          if (!confirm('¿Rechazar este pago?')) return;
          await this.api('PATCH', '/payments/admin/' + id + '/reject', {});
          this.loadPayments();
        },

        // Inventario
        async loadInventory() {
          const [logs, summary] = await Promise.all([
            this.api('GET', '/inventory/logs?take=50'),
            this.api('GET', '/inventory/summary'),
          ]);
          this.inventoryLogs = logs?.items || [];
          this.inventorySummary = summary || {};
          this.loadProducts();
        },
        openAdjustModal() {
          this.adjustForm = { productId: '', delta: 0, reason: '' };
          this.modal = 'adjust';
        },
        async saveAdjust() {
          this.loading = true;
          await this.api('POST', '/inventory/adjust', this.adjustForm);
          this.modal = null; this.loadInventory();
          this.loading = false;
        },

        // Helpers
        formatDate(d) {
          if (!d) return '—';
          return new Date(d).toLocaleDateString('es-GT', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        },
        statusColor(s) {
          const map = {
            DRAFT: 'bg-gray-100 text-gray-700',
            PENDING_PAYMENT: 'bg-yellow-100 text-yellow-700',
            PAYMENT_RECEIVED: 'bg-blue-100 text-blue-700',
            CONFIRMED: 'bg-green-100 text-green-700',
            IN_PRODUCTION: 'bg-indigo-100 text-indigo-700',
            FINISHED: 'bg-teal-100 text-teal-700',
            SHIPPED: 'bg-purple-100 text-purple-700',
            CANCELLED: 'bg-red-100 text-red-700',
          };
          return map[s] || 'bg-gray-100';
        },
        paymentStatusColor(s) {
          const map = { PENDING: 'bg-yellow-100 text-yellow-700', CONFIRMED: 'bg-green-100 text-green-700', REJECTED: 'bg-red-100 text-red-700' };
          return map[s] || 'bg-gray-100';
        },
      };
    }
  </script>
</body>
</html>
