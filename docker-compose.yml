# ============================================================
# docker-compose.yml — misello.gt
# Levanta todo el stack localmente o en cualquier VPS.
#
# Uso:
#   docker-compose up --build
#
# Requiere:
#   - Docker + Docker Compose
#   - Archivo .env en backend/ (copiar de .env.example y completar)
#   - Frontend buildeado: cd frontend && npm run build
# ============================================================

version: '3.8'

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: misello-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-misello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-misello123}
      POSTGRES_DB: ${POSTGRES_DB:-misello_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # para restore de dumps de Railway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misello} -d ${POSTGRES_DB:-misello_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS + Frontend estático servido) ──
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: misello-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override para conectar al contenedor de Postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-misello}:${POSTGRES_PASSWORD:-misello123}@postgres:5432/${POSTGRES_DB:-misello_db}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
