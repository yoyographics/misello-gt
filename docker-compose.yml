version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: misello-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: misello_user
      POSTGRES_PASSWORD: misello_password
      POSTGRES_DB: misello_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misello_user -d misello_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: misello-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://misello_user:misello_password@postgres:5432/misello_db
      NODE_ENV: development
      PORT: 3000
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  postgres_data:
